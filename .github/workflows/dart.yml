name: iOS-ipa-build

on:
  workflow_dispatch:

jobs:
  build-ios:
    name: 🎉 iOS Build
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v3

      - uses: subosito/flutter-action@v2
        with:
          channel: 'stable'
          architecture: x64
      - run: flutter pub get
      

      - run: pod repo update
        working-directory: ios

      - run: flutter build ios --release --no-codesign

      - run: |
          mkdir build/ios/iphoneos/Payload
          cp -r build/ios/iphoneos/Runner.app build/ build/ios/iphoneos/Payload/
          cd build/ios/iphoneos
          zip -r ../../sismos-col.ipa Payload

      - name: Upload binaries to release
        uses: actions/upload-artifact@v4
        with:
          name: ios-file-ipa
          path: build/FlutterIpaExport.ipa
          retention-days: 5
