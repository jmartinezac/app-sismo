name: sismo_jima
description: "A new Flutter project."
publish_to: 'none'

version: 1.0.0+1

environment:
  sdk: ^3.11.0

dependencies:
  flutter:
    sdk: flutter

  cupertino_icons: ^1.0.8
  http: ^1.6.0
  provider: ^6.1.5+1
  geolocator: ^14.0.3
  intl: ^0.20.3
  url_launcher: ^6.3.2
  google_fonts: ^8.2.1
  flutter_map: ^8.3.1
  latlong2: ^0.10.1
  flutter_local_notifications: ^22.3.0
  shared_preferences: ^2.5.5
  web_socket_channel: ^3.0.3
  firebase_core: ^3.10.0
  firebase_messaging: ^15.2.0
  flutter_native_splash: ^2.4.7

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0
  flutter_launcher_icons: ^0.14.3

flutter_launcher_icons:
  android: "launcher_icon"
  ios: true
  remove_alpha_ios: true
  image_path: "assets/icon/iconapp.png"
  min_sdk_android: 21
  web:
    generate: true
    image_path: "assets/icon/iconapp.png"
  windows:
    generate: true
    image_path: "assets/icon/iconapp.png"
    icon_size: 48
  macos:
    generate: true
    image_path: "assets/icon/iconapp.png"

flutter_native_splash:
  color: "#252829"

flutter:
  uses-material-design: true

  assets:
    - assets/icon/